# Proyecto Xcode de blaster.lcv para iPhone y iPad.
# En una Mac:  brew install xcodegen && ./prepare.sh && xcodegen && open BlasterLCV.xcodeproj
name: BlasterLCV
options:
  bundleIdPrefix: cl.lcv
  deploymentTarget:
    iOS: "15.0"
targets:
  BlasterLCV:
    type: application
    platform: iOS
    sources:
      - path: BlasterLCV
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.lcv.blaster
        PRODUCT_NAME: blaster.lcv
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BlasterLCV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
